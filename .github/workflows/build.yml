name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make sure Android SDK 34 is present
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure NVIDIA API (key from GitHub secret)
        run: |
          if [ -z "$NVIDIA_KEY" ]; then
            echo "SECRET NVIDIA_API_KEY IS EMPTY - add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "NVIDIA_API_KEY=$NVIDIA_KEY" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
